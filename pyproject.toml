[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog-tool"
version = "0.1.0"
description = "A local, offline digest of your coding-agent sessions. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "stillworks contributors" }]
keywords = [
  "claude-code", "codex", "coding-agents", "ai", "developer-tools",
  "session-log", "productivity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.scripts]
agentlog = "agentlog.cli:main"

[project.urls]
Homepage = "https://github.com/iselur/agentlog"

[tool.setuptools]
packages = ["agentlog"]
